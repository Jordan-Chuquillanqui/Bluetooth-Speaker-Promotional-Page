<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="css/grid.css" rel="stylesheet"/>
    <link href="css/main.css" rel="stylesheet"/>
    <title>Bluetooth Speaker</title>
</head>
<body>
    <header id="main-header">
        <div class="grid-con center-grid-con">
            <div id="logo" class="col-start-1 col-end-2">
                <img src="images/logo-white.svg" alt="JCH logo">
            </div>
            <nav id="main-nav" class="col-start-4 col-end-5 m-col-start-5 m-col-end-9">
                <h2 class="visually-hidden">Main Navigation</h2>
                <button id="button"></button>
            </nav>
                <div id="burger-con" class="col-span-full m-col-start-5 m-col-end-9">
                    <ul>
                        <li><a href="index.html">Home</a></li>
                        <li><a href="index.html">Products</a></li>
                        <li><a href="index.html">Support</a></li>
                    </ul>
                </div>
        </div>
    </header>

    <main>
    <section>
            <h2 class="visually-hidden">Hero Section</h2>
            <div>
                <canvas id="explode-view"></canvas>
            </div>
            <div>
                <img src="images/promotional image 3.png" alt="Promotional Image of the Speakers">
            </div>
    </section>
    <div class="grid-con center-grid-con">
        <section class="col-span-full">
            <model-viewer src="model/chuquillanqui_jordan_speaker.gltf" ar ar-modes="webxr scene-viewer quick-look" camera-controls tone-mapping="neutral" poster="poster.webp" shadow-intensity="1">
                <button class="Hotspot" slot="hotspot-1" data-position="-0.2375314372071684m -0.06917003387276943m -0.6612800031944361m" data-normal="0.020323652694362457m 0.005082966763557381m -0.999780532211965m" data-visibility-attribute="visible">
                    <div class="HotspotAnnotation" id="hotspot-1">
                    </div>
                </button>
                <button class="Hotspot" slot="hotspot-2" data-position="-0.07978256044100984m 0.46452003272618203m -0.18416548962259022m" data-normal="-0.1686032496698943m 0.9856839981458315m 5.77104357288539e-9m" data-visibility-attribute="visible">
                    <div class="HotspotAnnotation" id="hotspot-2">
                    </div>
                </button>
                <button class="Hotspot" slot="hotspot-3" data-position="0.015173045638876115m 0.4952808723081956m 0.6043996207543689m" data-normal="0.049666665292834616m 0.9987658496157593m -1.700017586173746e-9m" data-visibility-attribute="visible">
                    <div class="HotspotAnnotation" id="hotspot-3">
                    </div>
                </button>
                <button class="Hotspot" slot="hotspot-4" data-position="0.00603330800306154m -0.487806137125971m 0.18228387563168835m" data-normal="0.04966665909052028m -0.9987658499241882m -1.9220446649571344e-9m" data-visibility-attribute="visible">
                    <div class="HotspotAnnotation" id="hotspot-4">
                    </div>
                </button>
            </model-viewer>
            <section id="mobile-features">
                <h2>Features</h2>
            </section>
        </section>
    </div>
        
            
        <section class="grid-con center-grid-con">
            <h2 class="col-span-full">Take a look at what's inside</h2>
            <div class="col-span-full sliderContainer">
                <div id="xray">
                    <div id="divisor"></div>
                    <input type="range" min="0" max="100" value="50" id="slider">
                </div>
            </div>
        </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollToPlugin.min.js"></script>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.4.0/model-viewer.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
